checked:
  note: scripts/02_verify.py, with DuckDB 1.5.6, before upload
  items:
    - raw files against MANIFEST.json (size, sha256, csv module row count)
    - one Parquet per CSV and no other
    - Parquet row count equals the csv module count and the manifest
    - every value of every row equals the CSV read with the csv module and typed by the same rule, in CSV order
    - every column of the type its name gives, in CSV order
    - stations, GeoParquet 1.0.0 Point without crs (OGC:CRS84), every row a point at its lon and lat
    - a DuckDB without extensions opens every file
    - no bloom filters

modifications:
  raw: none. The site's CSVs, byte for byte.
  parquet:
    - columns typed by name; codes and small integer fields as INTEGER (every value an integer without leading zeros, else the build stops), lon and lat as DOUBLE, the rest text
    - empty fields as null
    - stations, a point geometry from lon and lat
    - rows in CSV order, written without bloom filters
